---
layout: default
---

<h1>{{ page.title }}</h1>

{% if page.description %}
  <p class="lead">{{ page.description }}</p>
{% endif %}

<div class="post-meta">
  {% if page.date %}
    <span>{{ page.date | date: "%Y-%m-%d" }}</span>
  {% endif %}

  {% if page.tags %}
    <span>
      tags:
      <em>{{ page.tags | join: "</em> - <em>" }}</em>
    </span>
  {% endif %}
</div>

{{ content }}
